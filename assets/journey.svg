<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="310" viewBox="0 0 1000 310" role="img" aria-label="Journey timeline">
  <defs>
    <linearGradient id="jbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070a12"/><stop offset="1" stop-color="#0d1322"/>
    </linearGradient>
    <linearGradient id="track" gradientUnits="userSpaceOnUse" x1="112" y1="0" x2="888" y2="0">
      <stop offset="0" stop-color="#7B61FF"/><stop offset="1" stop-color="#22E3A0"/>
    </linearGradient>
  </defs>
  <style>
    .sans { font-family: 'Segoe UI','Inter','Helvetica Neue',Ubuntu,'DejaVu Sans',Arial,sans-serif; }
    .mono { font-family: 'JetBrains Mono','Fira Code',Consolas,'DejaVu Sans Mono',monospace; }
    .yr { font-size:11px; font-weight:700; letter-spacing:1px; }
    .tt { font-size:14.5px; font-weight:700; fill:#eef1f8; }
    .ds { font-size:12px; fill:#8f9bb5; }
    .line { stroke-dasharray:780; stroke-dashoffset:780; animation: draw 2.4s ease .3s forwards; }
    .m { opacity:0; animation: pop .5s cubic-bezier(.2,.9,.3,1.3) forwards; }
    .halo { transform-box: fill-box; transform-origin: center; animation: ping 2.4s ease-out infinite; }
    .m1{animation-delay:.5s}.m2{animation-delay:.9s}.m3{animation-delay:1.3s}.m4{animation-delay:1.7s}.m5{animation-delay:2.1s}.m6{animation-delay:2.5s}
    @keyframes draw { to { stroke-dashoffset:0; } }
    @keyframes pop { from { opacity:0; transform: translateY(8px); } to { opacity:1; transform: translateY(0); } }
    @keyframes ping { 0% { transform: scale(1); opacity:.8; } 100% { transform: scale(2.6); opacity:0; } }
    @media (prefers-reduced-motion: reduce) { .line{stroke-dashoffset:0;animation:none} .m{opacity:1;animation:none} .halo{animation:none;opacity:0} }
  </style>

  <rect x="0.5" y="0.5" width="999" height="309" rx="18" fill="url(#jbg)" stroke="#1f2940"/>
  <text class="mono" x="32" y="36" font-size="12" fill="#7d8aa5" letter-spacing="1">$ git log --oneline --graph journey</text>

  <path d="M112 160 H888" stroke="#1c2436" stroke-width="4" stroke-linecap="round"/>
  <path class="line" d="M112 160 H888" stroke="url(#track)" stroke-width="4" stroke-linecap="round"/>

  <!-- 1 -->
  <g class="m m1">
    <path d="M112 160 V122" stroke="#3a3366" stroke-width="1.5"/>
    <circle cx="112" cy="160" r="8" fill="#0d1322" stroke="#7B61FF" stroke-width="3"/>
    <text class="mono yr" x="112" y="62" text-anchor="middle" fill="#9f8cff">2025</text>
    <text class="sans tt" x="112" y="84" text-anchor="middle">First full-stack builds</text>
    <text class="sans ds" x="112" y="102" text-anchor="middle">MERN · GreenCycle.lk</text>
    <text class="sans ds" x="112" y="117" text-anchor="middle">(SLIIT IT Project)</text>
  </g>
  <!-- 2 -->
  <g class="m m2">
    <path d="M267 160 V198" stroke="#3a3f6e" stroke-width="1.5"/>
    <circle cx="267" cy="160" r="8" fill="#0d1322" stroke="#7f73f5" stroke-width="3"/>
    <text class="mono yr" x="267" y="220" text-anchor="middle" fill="#9f8cff">2025</text>
    <text class="sans tt" x="267" y="242" text-anchor="middle">AI cart recovery</text>
    <text class="sans ds" x="267" y="260" text-anchor="middle">IRWA · ML offer suggestor</text>
    <text class="sans ds" x="267" y="275" text-anchor="middle">TF-IDF recommendations</text>
  </g>
  <!-- 3 -->
  <g class="m m3">
    <path d="M422 160 V122" stroke="#344370" stroke-width="1.5"/>
    <circle cx="422" cy="160" r="8" fill="#0d1322" stroke="#6a8cf0" stroke-width="3"/>
    <text class="mono yr" x="422" y="62" text-anchor="middle" fill="#8fb0ff">2026</text>
    <text class="sans tt" x="422" y="84" text-anchor="middle">Founded One Billion Labs</text>
    <text class="sans ds" x="422" y="102" text-anchor="middle">websites for salons,</text>
    <text class="sans ds" x="422" y="117" text-anchor="middle">banquet halls &amp; brands</text>
  </g>
  <!-- 4 -->
  <g class="m m4">
    <path d="M578 160 V198" stroke="#2d4b6a" stroke-width="1.5"/>
    <circle cx="578" cy="160" r="8" fill="#0d1322" stroke="#4fb0d8" stroke-width="3"/>
    <text class="mono yr" x="578" y="220" text-anchor="middle" fill="#7fd0f0">FEB – AUG 2026</text>
    <text class="sans tt" x="578" y="242" text-anchor="middle">Intern SE · ICT Division</text>
    <text class="sans ds" x="578" y="260" text-anchor="middle">Registrar of Companies</text>
    <text class="sans ds" x="578" y="275" text-anchor="middle">file tracking · eROC · IT inventory</text>
  </g>
  <!-- 5 -->
  <g class="m m5">
    <path d="M733 160 V122" stroke="#24564f" stroke-width="1.5"/>
    <circle cx="733" cy="160" r="8" fill="#0d1322" stroke="#33cfb0" stroke-width="3"/>
    <text class="mono yr" x="733" y="62" text-anchor="middle" fill="#6ee6c8">2026</text>
    <text class="sans tt" x="733" y="84" text-anchor="middle">Kola Vision research</text>
    <text class="sans ds" x="733" y="102" text-anchor="middle">YOLO11 + OCR agent that</text>
    <text class="sans ds" x="733" y="117" text-anchor="middle">navigates screens by voice</text>
  </g>
  <!-- 6 -->
  <g class="m m6">
    <path d="M888 160 V198" stroke="#1f5a45" stroke-width="1.5"/>
    <circle class="halo" cx="888" cy="160" r="8" fill="none" stroke="#22E3A0" stroke-width="2"/>
    <circle cx="888" cy="160" r="8" fill="#22E3A0"/>
    <text class="mono yr" x="888" y="220" text-anchor="middle" fill="#22E3A0">NOV 2026 · NOW</text>
    <text class="sans tt" x="888" y="242" text-anchor="middle">Co-founded Quintolink</text>
    <text class="sans ds" x="888" y="260" text-anchor="middle">web · design · apps</text>
    <text class="sans ds" x="888" y="275" text-anchor="middle">powered by curiosity</text>
  </g>
</svg>
