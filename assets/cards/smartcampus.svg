<svg xmlns="http://www.w3.org/2000/svg" width="480" height="170" viewBox="0 0 480 170" role="img" aria-label="Smart Campus Hub">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1020"/><stop offset="1" stop-color="#0f1626"/></linearGradient>
    <radialGradient id="h" cx="1" cy="0" r="0.9"><stop offset="0" stop-color="#f2c94c" stop-opacity=".28"/><stop offset="1" stop-color="#f2c94c" stop-opacity="0"/></radialGradient>
  </defs>
  <style>
    .s { font-family:'Segoe UI','Inter','Helvetica Neue',Ubuntu,'DejaVu Sans',Arial,sans-serif; }
    .m { font-family:'JetBrains Mono','Fira Code',Consolas,'DejaVu Sans Mono',monospace; }
    .box { stroke-dasharray:1300; stroke-dashoffset:1300; animation: d 1.2s ease .2s forwards; }
    .lab { opacity:0; animation: f .4s ease 1.2s forwards; }
    @keyframes d { to { stroke-dashoffset:0; } }
    @keyframes f { to { opacity:1; } }
    @media (prefers-reduced-motion: reduce) { .box { stroke-dashoffset:0; animation:none; } .lab { opacity:1; animation:none; } }
  </style>
  <rect x="0.5" y="0.5" width="479" height="169" rx="14" fill="url(#g)" stroke="#1f2940"/>
  <rect x="0.5" y="0.5" width="479" height="169" rx="14" fill="url(#h)"/>
  <rect class="box" x="8" y="20" width="464" height="142" rx="10" fill="none" stroke="#f2c94c" stroke-width="1.6"/>
  <g class="lab"><rect x="8" y="6" width="105" height="17" rx="3" fill="#f2c94c"/>
    <text class="m" x="14" y="18.5" font-size="11" font-weight="700" fill="#0b0f19">platform 0.96</text></g>
  <text class="s" x="26" y="58" font-size="22" font-weight="800" fill="#f2f4fa">Smart Campus Hub</text>
  <text class="s" x="26" y="84" font-size="13.5" fill="#9aa6bf">Campus resource &amp; booking platform with</text>
  <text class="s" x="26" y="103" font-size="13.5" fill="#9aa6bf">Google sign-in and role-based access.</text>
  <rect x="26" y="122" width="101" height="24" rx="12" fill="#151d30" stroke="#f2c94c" stroke-opacity=".55"/><text class="m" x="76" y="138" font-size="11.5" fill="#f7dc85" text-anchor="middle">Spring Boot</text>
  <rect x="135" y="122" width="57" height="24" rx="12" fill="#151d30" stroke="#f2c94c" stroke-opacity=".55"/><text class="m" x="164" y="138" font-size="11.5" fill="#f7dc85" text-anchor="middle">React</text>
  <rect x="200" y="122" width="94" height="24" rx="12" fill="#151d30" stroke="#f2c94c" stroke-opacity=".55"/><text class="m" x="247" y="138" font-size="11.5" fill="#f7dc85" text-anchor="middle">PostgreSQL</text>
  <rect x="302" y="122" width="64" height="24" rx="12" fill="#151d30" stroke="#f2c94c" stroke-opacity=".55"/><text class="m" x="334" y="138" font-size="11.5" fill="#f7dc85" text-anchor="middle">OAuth2</text>
  <text class="m" x="454" y="58" font-size="11" fill="#f7dc85" text-anchor="end">github · smart-campus ↗</text>
