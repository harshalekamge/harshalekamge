<svg xmlns="http://www.w3.org/2000/svg" width="480" height="170" viewBox="0 0 480 170" role="img" aria-label="Drift Barber">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1020"/><stop offset="1" stop-color="#0f1626"/></linearGradient>
    <radialGradient id="h" cx="1" cy="0" r="0.9"><stop offset="0" stop-color="#ff4d6d" stop-opacity=".28"/><stop offset="1" stop-color="#ff4d6d" stop-opacity="0"/></radialGradient>
  </defs>
  <style>
    .s { font-family:'Segoe UI','Inter','Helvetica Neue',Ubuntu,'DejaVu Sans',Arial,sans-serif; }
    .m { font-family:'JetBrains Mono','Fira Code',Consolas,'DejaVu Sans Mono',monospace; }
    .box { stroke-dasharray:1300; stroke-dashoffset:1300; animation: d 1.2s ease .2s forwards; }
    .lab { opacity:0; animation: f .4s ease 1.2s forwards; }
    @keyframes d { to { stroke-dashoffset:0; } }
    @keyframes f { to { opacity:1; } }
    @media (prefers-reduced-motion: reduce) { .box { stroke-dashoffset:0; animation:none; } .lab { opacity:1; animation:none; } }
  </style>
  <rect x="0.5" y="0.5" width="479" height="169" rx="14" fill="url(#g)" stroke="#1f2940"/>
  <rect x="0.5" y="0.5" width="479" height="169" rx="14" fill="url(#h)"/>
  <rect class="box" x="8" y="20" width="464" height="142" rx="10" fill="none" stroke="#ff4d6d" stroke-width="1.6"/>
  <g class="lab"><rect x="8" y="6" width="98" height="17" rx="3" fill="#ff4d6d"/>
    <text class="m" x="14" y="18.5" font-size="11" font-weight="700" fill="#0b0f19">website 0.98</text></g>
  <text class="s" x="26" y="58" font-size="22" font-weight="800" fill="#f2f4fa">Drift Barber</text>
  <text class="s" x="26" y="84" font-size="13.5" fill="#9aa6bf">Scroll-driven 3D experience for a barber</text>
  <text class="s" x="26" y="103" font-size="13.5" fill="#9aa6bf">chain — WebGL walk-in and card stories.</text>
  <rect x="26" y="122" width="49" height="24" rx="12" fill="#151d30" stroke="#ff4d6d" stroke-opacity=".55"/><text class="m" x="50" y="138" font-size="11.5" fill="#ff8fa3" text-anchor="middle">GSAP</text>
  <rect x="83" y="122" width="57" height="24" rx="12" fill="#151d30" stroke="#ff4d6d" stroke-opacity=".55"/><text class="m" x="112" y="138" font-size="11.5" fill="#ff8fa3" text-anchor="middle">WebGL</text>
  <rect x="148" y="122" width="57" height="24" rx="12" fill="#151d30" stroke="#ff4d6d" stroke-opacity=".55"/><text class="m" x="176" y="138" font-size="11.5" fill="#ff8fa3" text-anchor="middle">Lenis</text>
  <rect x="213" y="122" width="79" height="24" rx="12" fill="#151d30" stroke="#ff4d6d" stroke-opacity=".55"/><text class="m" x="252" y="138" font-size="11.5" fill="#ff8fa3" text-anchor="middle">HTML/CSS</text>
