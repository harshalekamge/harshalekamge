    <radialGradient id="h" cx="1" cy="0" r="0.9"><stop offset="0" stop-color="#7B61FF" stop-opacity=".28"/><stop offset="1" stop-color="#7B61FF" stop-opacity="0"/></radialGradient>
  </defs>
  <style>
