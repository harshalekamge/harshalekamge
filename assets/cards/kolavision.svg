  <rect class="box" x="8" y="20" width="464" height="142" rx="10" fill="none" stroke="#ff8a3d" stroke-width="1.6"/>
  <g class="lab"><rect x="8" y="6" width="105" height="17" rx="3" fill="#ff8a3d"/>
    <text class="m" x="14" y="18.5" font-size="11" font-weight="700" fill="#0b0f19">research 0.97</text></g>
  <text class="s" x="26" y="58" font-size="22" font-weight="800" fill="#f2f4fa">Kola Vision</text>
