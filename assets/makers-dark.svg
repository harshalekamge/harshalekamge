<svg xmlns="http://www.w3.org/2000/svg" viewBox="20 20 780 960" width="780" height="960" role="img" aria-label="Everything around you that you call life was made up by people that were no smarter than you. Steve Jobs">
<style>
.t{font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;font-weight:700;font-size:38px;letter-spacing:-1px;fill:#e6edf3}
.s{font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;font-size:12px;letter-spacing:1.5px;fill:#8b949e}
.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.flick{transform-box:fill-box;transform-origin:50% 100%;animation:fl .45s ease-in-out infinite alternate}
.flick2{transform-box:fill-box;transform-origin:50% 100%;animation:fl .35s ease-in-out infinite alternate-reverse}
@keyframes fl{from{transform:scale(1,.88)}to{transform:scale(.96,1.06)}}
.bob{animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px)}}
.exh{transform-box:fill-box;transform-origin:50% 0;animation:ex .2s linear infinite alternate}
@keyframes ex{to{transform:scaleY(.8)}}
.spin{transform-box:fill-box;transform-origin:center;animation:sp 14s linear infinite}
.spinf{transform-box:fill-box;transform-origin:center;animation:sp 6s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.glow{animation:gl 2s ease-in-out infinite alternate}
@keyframes gl{from{opacity:.25}to{opacity:.65}}
.blink{animation:bl 1s steps(1) infinite}
@keyframes bl{50%{opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
