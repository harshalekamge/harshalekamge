<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="320" viewBox="0 0 1000 320" role="img" aria-label="Harsha Lekamge — Founder, Engineer, Builder">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070a12"/>
      <stop offset="1" stop-color="#0d1322"/>
    </linearGradient>
    <radialGradient id="glowV" cx="0.2" cy="0.15" r="0.6">
      <stop offset="0" stop-color="#7B61FF" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#7B61FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowM" cx="0.85" cy="0.9" r="0.55">
      <stop offset="0" stop-color="#22E3A0" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#22E3A0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.55" stop-color="#d9d2ff"/>
      <stop offset="1" stop-color="#9ff5d6"/>
    </linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22E3A0" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#22E3A0" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#22E3A0" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#1c2436" stroke-width="1"/>
    </pattern>
    <clipPath id="frame"><rect width="1000" height="320" rx="18"/></clipPath>
  </defs>

  <style>
    .mono { font-family: 'JetBrains Mono','Fira Code','Cascadia Code',Consolas,'DejaVu Sans Mono',monospace; }
    .sans { font-family: 'Segoe UI','Inter','Helvetica Neue',Ubuntu,'DejaVu Sans',Arial,sans-serif; }
    .hud  { fill:#7d8aa5; font-size:12px; letter-spacing:1px; }
    .rec  { animation: blink 1.2s steps(2, start) infinite; }
    .scanline { animation: scan 4.5s linear infinite; }
    .name { opacity:0; animation: rise .9s cubic-bezier(.2,.8,.2,1) .2s forwards; }
    .tag  { opacity:0; animation: fade .5s ease forwards; }
    .box  { fill:none; stroke-width:2; stroke-dasharray:1400; stroke-dashoffset:1400; animation: draw 1.1s ease forwards; }
    .chip { opacity:0; animation: rise .6s ease forwards; }
    .node { animation: pulse 3s ease-in-out infinite; }
    .link { stroke-dasharray:4 6; animation: flow 6s linear infinite; }
    .b1{animation-delay:1.0s}.t1{animation-delay:1.9s}
    .c1{animation-delay:2.2s}.c2{animation-delay:2.45s}.c3{animation-delay:2.7s}.c4{animation-delay:2.95s}
    .b2{animation-delay:2.4s}.b3{animation-delay:2.65s}.b4{animation-delay:2.9s}.b5{animation-delay:3.15s}
    .t2{animation-delay:3.1s}.t3{animation-delay:3.35s}.t4{animation-delay:3.6s}.t5{animation-delay:3.85s}
    .n2{animation-delay:.8s}.n3{animation-delay:1.6s}.n4{animation-delay:2.4s}
    @keyframes blink { to { visibility:hidden; } }
    @keyframes scan { from { transform: translateY(-120px); } to { transform: translateY(340px); } }
    @keyframes rise { from { opacity:0; transform: translateY(14px); } to { opacity:1; transform: translateY(0); } }
    @keyframes fade { to { opacity:1; } }
    @keyframes draw { to { stroke-dashoffset:0; } }
    @keyframes pulse { 0%,100% { opacity:.35; } 50% { opacity:1; } }
    @keyframes flow { to { stroke-dashoffset:-100; } }
    @media (prefers-reduced-motion: reduce) {
      .name,.tag,.chip { opacity:1; animation:none; }
      .box { stroke-dashoffset:0; animation:none; }
      .scanline,.rec,.node,.link { animation:none; }
    }
  </style>

  <g clip-path="url(#frame)">
    <rect width="1000" height="320" fill="url(#bg)"/>
    <rect width="1000" height="320" fill="url(#grid)"/>
    <rect width="1000" height="320" fill="url(#glowV)"/>
    <rect width="1000" height="320" fill="url(#glowM)"/>

    <!-- constellation: five linked nodes (a nod to Quintolink) -->
    <g stroke="#7B61FF" stroke-opacity=".45" stroke-width="1.2" fill="none">
      <path class="link" d="M70 250 L140 205 L95 150 L170 120 L230 175 L140 205"/>
      <path class="link" d="M830 70 L900 110 L950 60 L905 175 L860 150 L900 110"/>
    </g>
    <g fill="#9f8cff">
      <circle class="node" cx="70" cy="250" r="3.5"/><circle class="node n2" cx="140" cy="205" r="4.5"/>
      <circle class="node n3" cx="95" cy="150" r="3"/><circle class="node n4" cx="170" cy="120" r="4"/>
      <circle class="node n2" cx="230" cy="175" r="3"/>
    </g>
    <g fill="#22E3A0">
      <circle class="node n3" cx="830" cy="70" r="3"/><circle class="node" cx="900" cy="110" r="4.5"/>
      <circle class="node n4" cx="950" cy="60" r="3.5"/><circle class="node n2" cx="905" cy="175" r="3"/>
      <circle class="node n3" cx="860" cy="150" r="4"/>
    </g>

    <!-- scanning beam -->
    <rect class="scanline" x="0" y="0" width="1000" height="110" fill="url(#scan)"/>

    <!-- HUD -->
    <g class="mono hud">
      <circle class="rec" cx="34" cy="31" r="5" fill="#ff4d6d"/>
      <text x="48" y="35">REC · kola-vision · detecting…</text>
      <text x="966" y="35" text-anchor="end">FPS 60 · CONF ≥ 0.95</text>
      <text x="34" y="296">6.93°N 79.86°E · SRI LANKA</text>
      <text x="966" y="296" text-anchor="end">frame 2026.11 · github.com/harshalekamge</text>
    </g>
    <!-- viewfinder corners -->
    <g stroke="#3b4660" stroke-width="2" fill="none">
      <path d="M20 60 V48 H32"/><path d="M980 60 V48 H968"/>
      <path d="M20 262 V274 H32"/><path d="M980 262 V274 H968"/>
    </g>

    <!-- name + main detection -->
    <text class="sans name" x="500" y="161" text-anchor="middle" font-size="62" font-weight="800"
          fill="url(#name)" textLength="600" lengthAdjust="spacingAndGlyphs">HARSHA LEKAMGE</text>
    <rect class="box b1" x="180" y="98" width="640" height="84" rx="4" stroke="#22E3A0"/>
    <g class="tag t1">
      <rect x="180" y="76" width="168" height="22" rx="3" fill="#22E3A0"/>
      <text class="mono" x="190" y="92" font-size="13" font-weight="700" fill="#06231a">human.builder 0.99</text>
    </g>

    <!-- role chips with mini detections -->
    <g class="sans" font-size="15" font-weight="600">
      <g class="chip c1">
        <rect x="88" y="214" width="196" height="34" rx="17" fill="#121a2b" stroke="#2a3550"/>
        <text x="186" y="236" text-anchor="middle" fill="#e6e9f2">Founder &amp; CEO · 1B Labs</text>
      </g>
      <g class="chip c2">
        <rect x="300" y="214" width="190" height="34" rx="17" fill="#121a2b" stroke="#2a3550"/>
        <text x="395" y="236" text-anchor="middle" fill="#e6e9f2">Co-founder · Quintolink</text>
      </g>
      <g class="chip c3">
        <rect x="506" y="214" width="180" height="34" rx="17" fill="#121a2b" stroke="#2a3550"/>
        <text x="596" y="236" text-anchor="middle" fill="#e6e9f2">Full-Stack Engineer</text>
      </g>
      <g class="chip c4">
        <rect x="702" y="214" width="210" height="34" rx="17" fill="#121a2b" stroke="#2a3550"/>
        <text x="807" y="236" text-anchor="middle" fill="#e6e9f2">Computer Vision · AI</text>
      </g>
    </g>
    <g stroke-width="1.5">
      <rect class="box b2" x="82" y="208" width="208" height="46" rx="6" stroke="#9f8cff"/>
      <rect class="box b3" x="294" y="208" width="202" height="46" rx="6" stroke="#9f8cff"/>
      <rect class="box b4" x="500" y="208" width="192" height="46" rx="6" stroke="#9f8cff"/>
      <rect class="box b5" x="696" y="208" width="222" height="46" rx="6" stroke="#9f8cff"/>
    </g>
    <g class="mono" font-size="10.5" font-weight="700" fill="#14102b">
      <g class="tag t2"><rect x="82" y="194" width="90" height="15" rx="2" fill="#9f8cff"/><text x="87" y="205">founder 0.98</text></g>
      <g class="tag t3"><rect x="294" y="194" width="90" height="15" rx="2" fill="#9f8cff"/><text x="299" y="205">startup 0.97</text></g>
      <g class="tag t4"><rect x="500" y="194" width="90" height="15" rx="2" fill="#9f8cff"/><text x="505" y="205">shipper 0.99</text></g>
      <g class="tag t5"><rect x="696" y="194" width="112" height="15" rx="2" fill="#9f8cff"/><text x="701" y="205">researcher 0.96</text></g>
    </g>
  </g>
  <rect x="0.5" y="0.5" width="999" height="319" rx="18" fill="none" stroke="#1f2940"/>
</svg>
