name: Update date card

on:
  schedule:
    - cron: "35 18 * * *" # 00:05 in Sri Lanka (UTC+5:30)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Draw today's card
        run: python scripts/date_card.py
      - name: Commit
        run: |
          git config user.name "Harsha Lekamge"
          git config user.email "lekamge.h2024@gmail.com"
          git add -A assets README.md
          git diff --cached --quiet || (git commit -m "Update banner date" && git push)
